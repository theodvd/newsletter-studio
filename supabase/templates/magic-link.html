<!-- Template Supabase « Magic Link » (connexion d'un compte existant).
     À coller dans : Dashboard Supabase > Authentication > Emails > Templates > Magic Link.
     Sujet conseillé : {{ .Token }} is your Newsletter Studio code
     Le code est l'action principale ; le lien reste en secours (même navigateur uniquement). -->
<div style="margin:0;padding:32px 16px;background-color:#0b1220;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:440px;margin:0 auto;background-color:#111a2e;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:36px 32px;text-align:center;">
    <p style="margin:0;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#7cc6ff;">Newsletter Studio</p>
    <h1 style="margin:16px 0 8px;font-size:20px;font-weight:600;color:#ffffff;">Your sign-in code</h1>
    <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#94a3b8;">
      Enter this code on the sign-in page. It expires in 1 hour.
    </p>
    <div style="display:inline-block;padding:16px 28px;background-color:#0b1220;border:1px solid rgba(124,198,255,0.35);border-radius:12px;">
      <span style="font-size:32px;font-weight:700;letter-spacing:10px;color:#ffffff;">{{ .Token }}</span>
    </div>
    <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#64748b;">
      Prefer one click? <a href="{{ .ConfirmationURL }}" style="color:#7cc6ff;text-decoration:underline;">Open Newsletter Studio</a><br>
      (the link only works in the browser where you requested it; the code works anywhere).
    </p>
    <p style="margin:24px 0 0;font-size:12px;color:#475569;">
      Didn't request this? You can safely ignore this email.
    </p>
  </div>
</div>
